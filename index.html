<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Win Go 1 Min</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1426; color: #fff; display: flex; justify-content: center; padding: 15px; }
    .container { width: 100%; max-width: 420px; background-color: #121f3d; border-radius: 16px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .title { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .user-info { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .user-info span { color: #f87171; cursor: pointer; }
    .wallet-box { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; color: #34d399; }

    /* Action Buttons */
    .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 16px; }
    .btn-action { border: none; padding: 8px 4px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; color: #fff; text-align: center; }
    .btn-deposit { background: #16a34a; }
    .btn-withdraw { background: #ea580c; }
    .btn-support { background: #0284c7; }
    .btn-history { background: #7c3aed; }

    /* Timer Card */
    .timer-card { background: #0f172a; border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; margin-bottom: 16px; border: 1px solid #1e293b; }
    .period-title { font-size: 11px; color: #94a3b8; }
    .period-id { font-size: 15px; font-weight: bold; }
    .timer-title { font-size: 11px; color: #94a3b8; text-align: right; }
    .timer-clock { font-size: 18px; font-weight: bold; color: #f8fafc; }

    /* Selection Elements */
    .section-title { font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 6px; }
    .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .btn-color { border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #fff; }
    .color-green { background: #22c55e; }
    .color-violet { background: #a855f7; }
    .color-red { background: #ef4444; }

    .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 16px; }
    .btn-num { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-active { border: 2px solid #38bdf8; transform: scale(0.96); }

    .chip-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .chip { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 6px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
    .input-box { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 14px; outline: none; }

    .btn-submit { width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    .btn-indicator { width: 100%; background: #1e293b; color: #94a3b8; border: none; padding: 10px; border-radius: 8px; font-size: 12px; cursor: default; }

    /* History Box */
    .history-card { margin-top: 15px; background: #0f172a; border-radius: 10px; padding: 10px; font-size: 12px; border: 1px solid #1e293b; }
    .history-card h4 { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .history-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1e293b; }

    /* Modals / Popups */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #1e293b; width: 100%; max-width: 350px; border-radius: 12px; padding: 16px; border: 1px solid #334155; text-align: center; }
    .modal-content h3 { margin-bottom: 10px; font-size: 16px; color: #38bdf8; }
    .modal-content p { font-size: 13px; color: #cbd5e1; margin-bottom: 15px; line-height: 1.4; }
    .modal-btn { background: #2563eb; border: none; color: #fff; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <div class="title">Win Go 1 Min</div>
        <div class="user-info">User: 7412881011 | <span onclick="openModal('Logout', 'Aapka demo account successfully logout ho gaya.')">Logout</span></div>
      </div>
      <div class="wallet-box">Wallet: <span id="wallet-balance">₹1000</span></div>
    </div>

    <!-- 4 Functional Action Buttons -->
    <div class="action-grid">
      <button class="btn-action btn-deposit" onclick="openModal('Deposit System', 'UPI / QR Code deposit option jald integrate hoga. Apna demo balance check karein.')">+ Deposit</button>
      <button class="btn-action btn-withdraw" onclick="openModal('Withdrawal System', 'Minimum withdrawal ₹110 hai. Aapka current balance demo testing mode me hai.')">💸 Withdraw</button>
      <button class="btn-action btn-support" onclick="openModal('24/7 Support', 'Telegram / Customer Care Support service connect ho rahi hai...')">🎧 Support</button>
      <button class="btn-action btn-history" onclick="toggleHistoryModal()">📜 History</button>
    </div>

    <!-- Timer Section -->
    <div class="timer-card">
      <div>
        <div class="period-title">Period ID</div>
        <div class="period-id" id="period-id">20260825001</div>
      </div>
      <div>
        <div class="timer-title">Remaining</div>
        <div class="timer-clock" id="timer">00:30</div>
      </div>
    </div>

    <!-- Selection Pads -->
    <div class="section-title">COLOR (2X - 4.5X)</div>
    <div class="color-grid">
      <button class="btn-color color-green" onclick="selectChoice('Green')">Green</button>
      <button class="btn-color color-violet" onclick="selectChoice('Violet')">Violet</button>
      <button class="btn-color color-red" onclick="selectChoice('Red')">Red</button>
    </div>

    <div class="section-title">NUMBER (9X)</div>
    <div class="number-grid">
      <button class="btn-num" onclick="selectChoice('0')">0</button>
      <button class="btn-num" onclick="selectChoice('1')">1</button>
      <button class="btn-num" onclick="selectChoice('2')">2</button>
      <button class="btn-num" onclick="selectChoice('3')">3</button>
      <button class="btn-num" onclick="selectChoice('4')">4</button>
      <button class="btn-num" onclick="selectChoice('5')">5</button>
      <button class="btn-num" onclick="selectChoice('6')">6</button>
      <button class="btn-num" onclick="selectChoice('7')">7</button>
      <button class="btn-num" onclick="selectChoice('8')">8</button>
      <button class="btn-num" onclick="selectChoice('9')">9</button>
    </div>

    <!-- Bet Inputs -->
    <div class="section-title">BET AMOUNT (₹)</div>
    <div class="chip-grid">
      <button class="chip" onclick="setAmount(10)">₹10</button>
      <button class="chip" onclick="setAmount(50)">₹50</button>
      <button class="chip" onclick="setAmount(100)">₹100</button>
      <button class="chip" onclick="setAmount(500)">₹500</button>
    </div>
    <input type="number" id="custom-amount" class="input-box" placeholder="Enter custom amount (₹)" />

    <button class="btn-submit" onclick="placeBet()">Confirm Bet</button>
    <button class="btn-indicator" id="selected-indicator">Select Color/Number to place bet</button>

    <!-- Inline History Section -->
    <div class="history-card">
      <h4>RECENT GAME HISTORY</h4>
      <div id="history-list">
        <div class="history-row"><span>20260825000</span><span style="color:#22c55e">Green (7)</span></div>
      </div>
    </div>
  </div>

  <!-- Popup / Modal Dialog -->
  <div class="modal" id="info-modal">
    <div class="modal-content">
      <h3 id="modal-title">Popup</h3>
      <p id="modal-body">Details yahan dikhengi.</p>
      <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    let currentSelection = null;
    let selectedAmount = 0;
    let balance = 1000;
    let period = 20260825001;
    let timeLeft = 30;

    // Timer Interval
    setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        timeLeft = 30;
        period++;
        document.getElementById('period-id').innerText = period;
        recordHistory();
      }
      document.getElementById('timer').innerText = `00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;
    }, 1000);

    function selectChoice(val) {
      currentSelection = val;
      document.getElementById('selected-indicator').innerText = `Selected: ${val}`;
    }

    function setAmount(amt) {
      selectedAmount = amt;
      document.getElementById('custom-amount').value = amt;
    }

    function placeBet() {
      const customVal = document.getElementById('custom-amount').value;
      const amount = customVal ? parseInt(customVal) : selectedAmount;

      if (!currentSelection) {
        openModal('Selection Missing', 'Kripya pehle Color ya Number select karein.');
        return;
      }
      if (!amount || amount <= 0) {
        openModal('Amount Missing', 'Kripya Bet Amount select karein.');
        return;
      }
      if (amount > balance) {
        openModal('Low Balance', 'Aapka wallet balance kam hai.');
        return;
      }

      balance -= amount;
      document.getElementById('wallet-balance').innerText = `₹${balance}`;
      openModal('Bet Confirmed', `Aapne Period ${period} me ₹${amount} ki bet '${currentSelection}' par place kar di hai.`);
    }

    function recordHistory() {
      const historyList = document.getElementById('history-list');
      const colors = ['Green', 'Red', 'Violet'];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      const randomNum = Math.floor(Math.random() * 10);
      
      const newRow = document.createElement('div');
      newRow.className = 'history-row';
      newRow.innerHTML = `<span>${period - 1}</span><span style="color:#38bdf8">${randomColor} (${randomNum})</span>`;
      historyList.prepend(newRow);
    }

    function openModal(title, message) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerText = message;
      document.getElementById('info-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('info-modal').style.display = 'none';
    }

    function toggleHistoryModal() {
      openModal('My Bet History', `Total Remaining Balance: ₹${balance}\nTotal Periods Played: Demo Records Active.`);
    }
  </script>
</body>
</html>
